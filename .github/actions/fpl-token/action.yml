name: Jeton FPL
description: >
  La FPL donne un nouveau jeton de connexion à chaque usage et un workflow ne peut pas
  réécrire ses secrets. Le dernier jeton passe donc d'un passage au suivant par le cache
  GitHub Actions, chiffré avec le secret FPL_REFRESH_TOKEN, que les forks n'ont pas.
  `restore` avant `fpl` (écrit $FPL_TOKEN_FILE), `save` juste après, même en cas d'échec.
  Depuis main seulement : le cache d'une autre branche n'est pas relu par main.
inputs:
  mode:
    description: restore ou save
    required: true
  secret:
    description: Le secret FPL_REFRESH_TOKEN
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        FPL_REFRESH_TOKEN: ${{ inputs.secret }}
      run: $GITHUB_ACTION_PATH/token.sh key

    # Aucune entrée ne s'appelle « -restore » : seule joue restore-keys, qui prend la plus
    # récente de ce secret, celle du dernier passage.
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/fpl-token.enc
        key: ${{ steps.key.outputs.key }}-restore
        restore-keys: ${{ steps.key.outputs.key }}-
    - if: inputs.mode == 'restore'
      shell: bash
      env:
        FPL_REFRESH_TOKEN: ${{ inputs.secret }}
      run: $GITHUB_ACTION_PATH/token.sh open

    - id: seal
      if: inputs.mode == 'save'
      shell: bash
      env:
        FPL_REFRESH_TOKEN: ${{ inputs.secret }}
      run: $GITHUB_ACTION_PATH/token.sh seal
    # Une clé par passage et par job (un passage peut vérifier la connexion puis régler
    # l'équipe) : une entrée de cache ne se remplace pas.
    - if: steps.seal.outputs.sealed == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/fpl-token.enc
        key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    # Un enregistrement raté n'est qu'un avertissement pour actions/cache : le jeton serait
    # perdu sans bruit. On vérifie qu'il est bien là, pour que l'alerte parte.
    - if: steps.seal.outputs.sealed == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/fpl-token.enc
        key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        lookup-only: true
        fail-on-cache-miss: true
